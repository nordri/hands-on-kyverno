apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: image-tag-validation
policies:
  - disallow-latest-test.yaml
resources:
  - resources.yaml
results:
  - policy: disallow-latest
    rule: disallow-latest
    resources:
      - nginx-versioned
    kind: Pod
    result: pass
  - policy: disallow-latest
    rule: disallow-latest
    resources:
      - nginx-latest
    kind: Pod
    result: fail
